# Theme source registry for GOAL.md Phase 2: metadata and links only.
# No theme asset, wallpaper, palette file or screenshot from these sources is copied into yolo-ui.
# Every URL was fetched with `curl -s -L -o /dev/null -w '%{http_code}'` on the date in [meta];
# `status` is that HTTP status after redirects and `url` is the final (post-redirect) address.
# `license` is the repository license reported by the GitHub/GitLab API, the license stated by
# the documentation site, or "listing only" for catalogs whose entries carry their own licenses.
# `kind`: repo | docs | tool | listing | spec.

[meta]
checked = "2026-11-05"
method = "curl -s -L -o /dev/null --max-time 20 -w '%{http_code} %{url_effective}'"
consumers = ["crates/yolo-emit", "bun ui theme emit"]

