# Yolo UI theme systems and theme registries (GOAL.md, Phase 2).
#
# Catalog metadata and links only. No theme file, image, icon or font is copied into the repo from
# any entry below; assets that do enter the repo go through `catalog/assets.lock.toml` first.
#
# [[system]]   a theming system, token source, theme format or icon set Yolo UI maps to or reads.
# [[registry]] a place that lists themes (community or official); metadata and links only.
# [[source]]   verified theme source entry (`validate.rs` checks `checked`, `method`, `[[source]]`).
#
# Presets: neutral, m3, fluent, apple, omarchy, hyprland, aphrody, chromium.

[meta]
schema = 1
updated = "2026-11-05"
checked = "2026-11-05"
method = "curl -s -L -o /dev/null --max-time 20 -w '%{http_code} %{url_effective}'"
owner = "crates/yolo-emit"
consumers = ["crates/yolo-emit", "bun ui theme emit"]
sections = ["android-m3", "chromium", "fluent", "apple", "gtk", "cosmic", "omarchy", "icons"]

