# Asset lock for every third-party or original asset that enters yolo-ui.
#
# Licensing gate (GOAL.md): record source URL, pinned commit or version, license and attribution before an asset
# is committed. `bun ui icons fetch` reads this file and materializes exactly the listed subset into `dir`;
# `yolo-icons build` reads the same file to import, optimize and bundle the sets in `priority` order (lower wins
# when two sets define the same canonical name).
#
# Never listed here, never fetched: Apple SF Symbols / SF fonts, Segoe Fluent Icons / Segoe UI Variable font files,
# or any asset whose license does not allow redistribution.

schema = 1

[[set]]
id = "aphrody"
name = "Aphrody Symbols (original marks)"
format = "svg"
license = "MIT OR Apache-2.0"
upstream = "https://github.com/yolo-rs/yolo-ui"
version = "0.8.0-alpha.3"
attribution = "Original artwork by Aphrody / Yolo UI Contributors, drawn on the Material Symbols 24 and 48 dp grids."
fetch = "local"
dir = "crates/yolo-icons/assets/aphrody"
priority = 0

[set.icons]
aphrody_mark = "aphrody_mark_24.svg"
aphrody_mark_48 = "aphrody_mark_48.svg"

