[package]
name = "ui-bench-leptos"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Lane 2 of apps/ui-bench: the same pages rebuilt in Leptos 0.8 markup, rendered once (static SSR) and served by Axum"
license = "Apache-2.0"
publish = false

# Standalone: ignore the parent yolo-stack workspace (same convention as apps/shenron/crates/*).
[workspace]

[dependencies]
leptos = { version = "0.8.23", features = ["ssr"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
