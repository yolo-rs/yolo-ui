[package]
authors = ["Jamie Pine <jamie@spacedrive.com>"]
edition = "2021"
name    = "task-validator"
version = "0.1.0"

[dependencies]
chrono = { workspace = true }
clap        = { version = "4.5", features = ["derive"] }
comfy-table = "7.1"
