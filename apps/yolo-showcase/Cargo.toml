[package]
name = "yolo-showcase"
version = { workspace = true }
authors = ["Yolo UI Contributors <contact@aphrody.com>"]
edition = "2024"
rust-version.workspace = true
description = "Unified multi-engine & 7-theme showcase app for Yolo UI (Dioxus 0.8, GPUI, Iced, Cosmic, Egui, GTK4, Qt6, Tauri v3, Craft, Storyteller, Migrator & React 19/Expo)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/yolo-rs/yolo-ui"
publish = false

[dependencies]
yolo-shared = { workspace = true }
yolo-ui = { workspace = true, features = ["lib", "multi-engine"] }
yolo-tokens = { workspace = true }
yolo-contracts = { workspace = true }
yolo-emit = { workspace = true }
yolo-layout = { workspace = true }
yolo-migrator = { workspace = true }
yolo-shell = { workspace = true }
yolo-craft = { workspace = true }
yolo-storyteller = { workspace = true }
yolo-react = { workspace = true }
dioxus = { workspace = true, default-features = false, features = ["lib"] }
dioxus-ssr = { workspace = true }
