# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "yolo-shell"
version = "0.8.0"
edition = "2024"
rust-version = "1.85.0"
authors = ["Yolo UI Contributors"]
repository = "https://github.com/yolo-rs/yolo-ui"
license = "MIT OR Apache-2.0"
description = "Unified native application shell lifecycle API for Yolo UI: AppInfo, YoloManifest integration, window state persistence, single instance, deep links, menus, tray, dialogs, notifications, clipboard, system theme detection, and signed updates."
publish = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"

[features]
default = []
full = ["menu", "tray", "dialogs", "notifications", "clipboard", "updater"]
# Declarative menu model rendered with muda (GTK 3 on Linux).
menu = ["dep:muda", "muda/gtk3", "dep:raw-window-handle"]
# System tray through tray-icon (libayatana-appindicator3 + GTK 3 on Linux).
tray = ["menu", "dep:tray-icon", "tray-icon/libappindicator", "dep:gtk"]
dialogs = ["dep:rfd", "dep:raw-window-handle"]
notifications = ["dep:notify-rust"]
clipboard = ["dep:arboard"]
updater = ["dep:ureq", "dep:ed25519-dalek", "dep:sha2", "dep:base64", "dep:semver"]

# Toolkit backends.
eframe = ["dep:eframe"]
winit = ["dep:winit", "dep:raw-window-handle"]
bevy = ["dep:bevy_window", "dep:bevy_app", "dep:bevy_ecs", "dep:bevy_math"]
tauri = ["dep:tauri"]

[dependencies]
yolo-shared = { path = "../yolo-shared" }
directories = "6.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"

raw-window-handle = { version = "0.6.0", optional = true }
muda = { version = "0.21.2", default-features = false, optional = true }
tray-icon = { path = "../../submodules/tray-icon", version = "0.26.1", default-features = false, optional = true }
rfd = { version = "0.17.1", optional = true }
notify-rust = { version = "4", optional = true }
arboard = { version = "3.6", optional = true }

ureq = { version = "3.1.2", optional = true }
ed25519-dalek = { version = "3.0.0", optional = true }
sha2 = { version = "0.10.9", optional = true }
base64 = { version = "0.22.1", optional = true }
semver = { version = "1.0.28", optional = true }

eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow"], optional = true }
winit = { version = "=0.31.0-beta.3", optional = true }
bevy_window = { version = "0.20.0", default-features = false, features = ["std"], optional = true }
bevy_app = { version = "0.20.0", default-features = false, features = ["std"], optional = true }
bevy_ecs = { version = "0.20.0", default-features = false, features = ["std"], optional = true }
bevy_math = { version = "0.20.0", default-features = false, features = ["std"], optional = true }
tauri = { version = "2", default-features = false, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
gtk = { version = "0.18", optional = true }
