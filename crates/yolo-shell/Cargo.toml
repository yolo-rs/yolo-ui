# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "yolo-shell"
version = { workspace = true }
edition.workspace = true
rust-version.workspace = true
authors = ["Yolo UI Contributors"]
repository = "https://github.com/yolo-rs/yolo-ui"
license = "MIT OR Apache-2.0"
description = "Unified native application shell lifecycle API for Yolo UI: AppInfo, YoloManifest integration, window state persistence, single instance, deep links, menus, tray, dialogs, notifications, clipboard, system theme detection, and signed updates."
publish = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"

[features]
default = []
full = ["menu", "tray", "dialogs", "notifications", "clipboard", "updater"]
# Declarative menu model rendered with muda (GTK 3 on Linux).
menu = ["dep:muda", "muda/gtk3", "dep:raw-window-handle"]
# System tray through tray-icon (libayatana-appindicator3 + GTK 3 on Linux).
tray = ["menu", "dep:tray-icon", "tray-icon/libappindicator", "dep:gtk"]
dialogs = ["dep:rfd", "dep:raw-window-handle"]
notifications = ["dep:notify-rust"]
clipboard = ["dep:arboard"]
updater = ["dep:ureq", "dep:ed25519-dalek", "dep:sha2", "dep:base64", "dep:semver"]

# Toolkit backends.
eframe = ["dep:eframe"]
winit = ["dep:winit", "dep:raw-window-handle"]
bevy = ["dep:bevy_window", "dep:bevy_app", "dep:bevy_ecs", "dep:bevy_math"]
tauri = ["dep:tauri"]

[dependencies]
yolo-shared = { workspace = true }
directories = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

raw-window-handle = { workspace = true, optional = true }
muda = { workspace = true, optional = true }
tray-icon = { workspace = true, optional = true }
rfd = { workspace = true, optional = true, features = ["xdg-portal"] }
notify-rust = { workspace = true, optional = true }
arboard = { workspace = true, optional = true }

ureq = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
semver = { workspace = true, optional = true }

eframe = { workspace = true, features = ["default_fonts", "glow"], optional = true }
winit = { workspace = true, optional = true }
bevy_window = { workspace = true, features = ["std"], optional = true }
bevy_app = { workspace = true, features = ["std"], optional = true }
bevy_ecs = { workspace = true, features = ["std"], optional = true }
bevy_math = { workspace = true, features = ["std"], optional = true }
tauri = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
gtk = { version = "0.18", optional = true }
