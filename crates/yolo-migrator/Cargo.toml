[package]
name = "yolo-migrator"
version = { workspace = true }
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/yolo-rs/yolo-ui"
description = "Shadcn UI / Radix UI / Base UI / Material 3 / Tailwind CSS TSX-to-Rust migrator targeting Dioxus 0.8, WebGPU/Taffy, Egui, Cosmic/Iced, GTK4, and Qt6 QML."
publish = false
autoexamples = false

[lib]
name = "yolo_migrator"
path = "src/lib.rs"

[[bin]]
name = "yolo-migrate"
path = "src/main.rs"

[dependencies]
oxc_allocator = { workspace = true }
oxc_ast = { workspace = true }
oxc_parser = { workspace = true }
oxc_span = { workspace = true }
lightningcss = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
yolo-layout = { workspace = true }
yolo-shared = { workspace = true }
