[package]
name = "yolo-craft"
version = { workspace = true }
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
description = "Shared egui creative workbench chrome, docking, layout, tabs, printing, and 13 Craft domain workbench contracts for Yolo UI"
repository = "https://github.com/yolo-rs/yolo-ui"

[features]
default = ["serde"]
serde = ["dep:serde", "egui/serde"]

[dependencies]
yolo-shared = { workspace = true }
yolo-tokens = { workspace = true }
egui = { workspace = true }
serde = { workspace = true, features = ["derive"], optional = true }

[dev-dependencies]
serde_json = { workspace = true }
