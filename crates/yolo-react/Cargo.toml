[package]
name = "yolo-react"
version = "0.8.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yolo-rs/yolo-ui"
description = "Yolo UI Pure-Rust React 19 & React Native / Expo Engine: RSC Flight Protocol & Streaming SSR, React Native StyleSheet -> Taffy 0.15 Layout Solver, OXC React Compiler & Hook Analyzer, C++ JSI / UniFFI TurboModule Emitter, and 7-Preset Theme Bridge."
publish = false
autoexamples = false

[lib]
name = "yolo_react"
path = "src/lib.rs"

[dependencies]
oxc_allocator = "0.155"
oxc_ast = "0.155"
oxc_parser = "0.155"
oxc_span = "0.155"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
yolo-layout = { path = "../yolo-layout", version = "0.8.0" }
yolo-shared = { path = "../yolo-shared" }
yolo-tokens = { path = "../yolo-tokens", version = "0.8.0" }
