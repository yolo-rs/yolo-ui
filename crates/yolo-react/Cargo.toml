[package]
name = "yolo-react"
version = { workspace = true }
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/yolo-rs/yolo-ui"
description = "Yolo UI Pure-Rust React 19 & React Native / Expo Engine: RSC Flight Protocol & Streaming SSR, React Native StyleSheet -> Taffy 0.15 Layout Solver, OXC React Compiler & Hook Analyzer, C++ JSI / UniFFI TurboModule Emitter, and 7-Preset Theme Bridge."
publish = false
autoexamples = false

[lib]
name = "yolo_react"
path = "src/lib.rs"

[dependencies]
oxc_allocator = { workspace = true }
oxc_ast = { workspace = true }
oxc_parser = { workspace = true }
oxc_span = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
yolo-layout = { workspace = true }
yolo-shared = { workspace = true }
yolo-tokens = { workspace = true }
