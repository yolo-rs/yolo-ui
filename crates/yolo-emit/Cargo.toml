# SPDX-License-Identifier: Apache-2.0
[package]
name = "yolo-emit"
version = { workspace = true }
edition.workspace = true
rust-version.workspace = true
authors = ["Yolo UI Contributors"]
repository = "https://github.com/yolo-rs/yolo-ui"
license = "MIT OR Apache-2.0"
description = "Multi-preset theme emitter for Yolo UI: writes Neutral, M3, Fluent 2, Apple HIG Liquid Glass, and Aphrody Byron Love schemes as CSS, GTK4/libadwaita, KDE, COSMIC, Qt6 QML, WinUI 3, Fluent 2, Apple Liquid Glass, Hyprland, and W3C DTCG themes."

[dependencies]
yolo-shared = { workspace = true }
yolo-tokens = { workspace = true }

[[bin]]
name = "yolo-emit"
path = "src/main.rs"
