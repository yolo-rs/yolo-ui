# SPDX-License-Identifier: Apache-2.0
[package]
name = "yolo-render"
version = { workspace = true }
edition.workspace = true
rust-version.workspace = true
authors = ["Yolo UI Contributors"]
repository = "https://github.com/yolo-rs/yolo-ui"
license = "MIT OR Apache-2.0"
description = "Unified Yolo UI native renderer contract: 2D/3D scene graphs, deterministic CPU rasterizer, and optional WGPU backend."
publish = false
autoexamples = false

[features]
default = ["cpu", "parallel"]
cpu = []
parallel = ["dep:rayon"]
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
vulkan = ["gpu"]
dx12 = ["gpu"]
metal = ["gpu"]
webgpu = ["gpu"]
webgl = ["gpu"]
all-gpu = ["vulkan", "dx12", "metal", "webgpu", "webgl"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[dependencies]
aphrody-m3-tokens = { workspace = true }
yolo-shared = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
png = { workspace = true }
fontdue = { workspace = true }
rayon = { workspace = true, optional = true }
base64 = { workspace = true }
gltf = { workspace = true, features = ["utils", "names", "KHR_materials_emissive_strength", "KHR_materials_unlit"] }
tobj = { workspace = true }
wgpu = { workspace = true, optional = true, features = ["wgsl", "dx12", "vulkan", "metal", "webgpu", "webgl"] }
pollster = { workspace = true, optional = true }
bytemuck = { workspace = true, features = ["derive"], optional = true }
