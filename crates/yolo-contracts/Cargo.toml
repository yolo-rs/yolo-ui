# SPDX-License-Identifier: Apache-2.0
[package]
name = "yolo-contracts"
version = { workspace = true }
edition.workspace = true
rust-version.workspace = true
authors = ["Yolo UI Contributors"]
repository = "https://github.com/yolo-rs/yolo-ui"
license = "MIT OR Apache-2.0"
description = "Host-neutral Rust component, accessibility, keyboard, focus, Taffy layout, and 5-preset theme contracts for Yolo UI."

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[features]
default = []
native-render = []
wasm = []

[dependencies]
yolo-shared = { workspace = true }
yolo-tokens = { workspace = true, features = ["serde"] }
taffy = { workspace = true }
serde = { workspace = true, features = ["derive"] }
