[package]
name = "yolo-3d"
version = "0.8.0"
edition = "2024"
rust-version = "1.85.0"
authors = ["Yolo UI Contributors"]
repository = "https://github.com/yolo-rs/yolo-ui"
license = "MIT OR Apache-2.0"
description = "Unified 3D engine bridge for Yolo UI: Three.js/R3F JSX to WGPU 30/29 translator, glTF 2.0/OBJ loaders, Bevy 0.16 ECS integration, and Blender/Assimp asset pipeline."
publish = false

[features]
default = ["wgpu", "gltf", "obj"]
wgpu = ["dep:wgpu", "yolo-render/gpu"]
gltf = ["dep:gltf"]
obj = ["dep:tobj"]
bevy = ["dep:bevy_math", "dep:bevy_transform"]

[dependencies]
yolo-shared = { path = "../yolo-shared" }
yolo-tokens = { path = "../yolo-tokens" }
yolo-render = { path = "../yolo-render" }
yolo-gpu = { path = "../yolo-gpu" }

wgpu = { version = "30.0.1", optional = true, features = ["wgsl", "dx12", "vulkan", "metal", "webgpu"] }
naga = { version = "30.0.0", features = ["spv-in", "wgsl-out"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

gltf = { version = "1.4.1", optional = true, default-features = false, features = ["utils", "names", "KHR_materials_emissive_strength", "KHR_materials_unlit"] }
tobj = { version = "4.0.3", optional = true, default-features = false }
bytemuck = { version = "1.21", features = ["derive"] }

bevy_math = { version = "0.16", optional = true }
bevy_transform = { version = "0.16", optional = true }
