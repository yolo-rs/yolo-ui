[package]
name = "yolo-3d"
version = { workspace = true }
edition.workspace = true
rust-version.workspace = true
authors = ["Yolo UI Contributors"]
repository = "https://github.com/yolo-rs/yolo-ui"
license = "MIT OR Apache-2.0"
description = "Unified 3D engine bridge for Yolo UI: Three.js/R3F JSX to WGPU 30/29 translator, glTF 2.0/OBJ loaders, Bevy 0.16 ECS integration, and Blender/Assimp asset pipeline."
publish = false

[features]
default = ["wgpu", "gltf", "obj"]
wgpu = ["dep:wgpu", "yolo-render/gpu"]
gltf = ["dep:gltf"]
obj = ["dep:tobj"]
bevy = ["dep:bevy_math", "dep:bevy_transform"]

[dependencies]
yolo-shared = { workspace = true }
yolo-tokens = { workspace = true }
yolo-render = { workspace = true }

wgpu = { workspace = true, optional = true, features = ["wgsl", "dx12", "vulkan", "metal", "webgpu"] }
naga = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

gltf = { workspace = true, optional = true, features = ["utils", "names", "KHR_materials_emissive_strength", "KHR_materials_unlit"] }
tobj = { workspace = true, optional = true }
bytemuck = { workspace = true, features = ["derive"] }

bevy_math = { workspace = true, features = ["std"], optional = true }
bevy_transform = { workspace = true, features = ["std"], optional = true }
