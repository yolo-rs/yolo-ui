[package]
name = "yolo-gpu"
version = { workspace = true }
edition.workspace = true
rust-version.workspace = true
authors = ["Yolo UI Contributors"]
repository = "https://github.com/yolo-rs/yolo-ui"
license = "MIT OR Apache-2.0"
description = "Unified WebGPU/WGPU backend, SPIR-V to WGSL shader translator, 2D sprite sheet & atlas engine, and SVG sanitizer/optimizer/rasterizer for Yolo UI."
publish = false
autoexamples = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
cuda = []
wasm-abi = ["dep:js-sys", "dep:wasm-bindgen"]

[dependencies]
yolo-shared = { workspace = true }
yolo-tokens = { workspace = true }
wgpu = { workspace = true }
naga = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
roxmltree = { workspace = true }
resvg = { workspace = true }
svgtypes = { workspace = true }
skrifa = { workspace = true }
woff2 = { workspace = true }
js-sys = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = { workspace = true }
