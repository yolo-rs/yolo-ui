ort = { version = "2.0.0-rc.9", default-features = false, features = ["download-binaries", "tls-native"] }
[profile.dev-debug]
inherits = "dev"
codegen-units = 256
debug = "full"
incremental = true
lto = "off"
opt-level = 0
strip = "none"

[profile.dev-debug.package."*"]
debug = "full"
incremental = false
opt-level = 3

[profile.spacedrive-dev]
inherits = "dev"
codegen-units = 256
debug = 0
incremental = true
lto = false
opt-level = 0
split-debuginfo = "unpacked"
strip = "none"

[profile.spacedrive-dev.build-override]
opt-level = 3

[profile.spacedrive-dev.package."*"]
incremental = false
opt-level = 3

[profile.mobile-dev]
inherits = "release"
codegen-units = 16
lto = false
opt-level = 2
strip = true

[profile.extension-release]
inherits = "release"
opt-level = "z"
codegen-units = 1
lto = true
strip = true

# Cargo cannot set `lto` or `panic` per package, so Tauri app builds that need fat LTO and
# `panic = "abort"` use named profiles: `cargo build --profile tauri-release` (see docs/recon/TAURI-BUN.md).
# Spacedrive relies on unwinding; keep it on the default release profile unless its commands are audited.
[profile.tauri-release]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Faster CI variant of tauri-release (thin LTO).
[profile.tauri-ci]
inherits = "release"
lto = "thin"

[profile.dev]
debug = "line-tables-only"

# our release profile should be fast to compile and fast to run
# when we ship our CI builds, we turn on LTO which improves perf leftover by turning on incremental
[profile.release]
incremental = true
panic = "unwind"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# crank up the opt level for wasm-split-cli in dev mode
# important here that lto is on and the debug symbols are present (since they're used by wasm-opt)
[profile.wasm-split-release]
inherits = "release"
opt-level = 'z'
lto = true
debug = true

# a profile for running the CLI that's also incremental
[profile.cli-release-dev]
inherits = "release"
opt-level = 3
incremental = true

# crank up walrus since it's quite slow in dev mode
[profile.dev.package.walrus]
opt-level = 3

# Keep debug assertions for fuzzing, but compile the reusable fuzzer crate
# with release-style optimizations. (The libFuzzer binary `dioxus-fuzz` lives
# as a member of this workspace with its profile declared here.
[profile.dev.package.dioxus-vdom-fuzz]
opt-level = 3

[profile.dev.package.dioxus-fuzz]
opt-level = 3

# ensure we have adversarial setup for tls
[profile.dev.package.cross-tls-crate]
opt-level = 2

[profile.dev.package.cross-tls-crate-dylib]
opt-level = 2

[profile.release-max-opt]
inherits = "release"
lto = true
codegen-units = 1

# Disable debug assertions to check the released path of core and other packages, but build without optimizations to keep build times quick
[profile.release-unoptimized]
inherits = "dev"
debug-assertions = false
incremental = true

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

# This is a "virtual package"
# It is not meant to be published, but is used so "cargo run --example XYZ" works properly
[package]
name = "dioxus-examples"
authors = ["Jonathan Kelley"]
edition = "2024"
description = "Top level crate for the Dioxus repository"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aphrody-labs/yolo-ui"
documentation = "https://dioxuslabs.com"
keywords = ["dom", "ui", "gui", "react", "wasm"]
rust-version = "1.85.0"
publish = false
version = "0.7.5"

[dependencies]
reqwest = { workspace = true, features = ["json"] }
ciborium = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
http-range = { workspace = true }
wgpu = { workspace = true, optional = true }
winit = { workspace = true, optional = true }
ouroboros = { version = "*", optional = true }
wasm-splitter = { workspace = true }

sqlx = { workspace = true, features = [
    "macros",
    "migrate",
    "postgres",
    "_unstable-all-types",
    "tls-native-tls",
], optional = true }
wasm-streams = { workspace = true }

[dev-dependencies]
dioxus = { workspace = true, features = ["router", "fullstack"] }
dioxus-html = { workspace = true, features = ["serialize"] }
dioxus-stores = { workspace = true }
dioxus-ssr = { workspace = true }
futures-util = { workspace = true }
separator = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
rand = { workspace = true, features = ["small_rng"] }
form_urlencoded = { workspace = true }
futures-timer = { version = "3.0.4", features = ["wasm-bindgen"] }
web-time = "1.1.0"
anyhow = { workspace = true }
thiserror = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
axum-core = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
tower-http = { workspace = true, features = ["timeout"] }
pollster = "0.4.0"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
tokio = { version = "1.52.1", default-features = false, features = [
    "sync",
    "macros",
    "io-util",
    "rt",
    "time",
] }
uuid = { workspace = true, features = ["v4", "serde", "js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1.52.1", features = ["full"] }

# To make most examples faster to compile, we split out assets and http-related stuff
# This trims off like 270 dependencies, leading to a significant speedup in compilation time
[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
native = ["dioxus/native", "winit"]
liveview = ["dioxus/liveview"]
server = ["dioxus/server"]
mobile = ["dioxus/mobile"]
web = ["dioxus/web"]
gpu = ["dep:ouroboros", "dep:wgpu"]

