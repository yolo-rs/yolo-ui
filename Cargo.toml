[workspace.package]
version = "0.8.0-alpha.3"
authors = ["Yolo UI Contributors <contact@aphrody.com>", "Jonathan Kelley", "Dioxus Labs"]
edition = "2024"
license = "MIT OR Apache-2.0"
homepage = "https://aphrody.com"
repository = "https://github.com/yolo-rs/yolo-ui"
categories = ["gui", "web-programming", "wasm"]
keywords = ["yolo-ui", "dioxus", "fullstack", "gui", "web", "wasm"]
rust-version = "1.95"

# dependencies that are shared across packages
[workspace.dependencies]
libfuzzer-sys = "0.4.7"
cmov = "0.5.4"
bincode = { version = "2.0.1", features = ["alloc", "derive", "serde"] }
