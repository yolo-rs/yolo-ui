aead = { version = "0.6.1", default-features = false }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "rand_core"] }
yolo-shared = { path = "crates/yolo-shared", version = "=0.8.0-alpha.3" }
