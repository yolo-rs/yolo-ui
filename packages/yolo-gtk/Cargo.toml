[package]
name = "yolo-gtk"
version = "0.8.0"
edition = "2024"
license = "Apache-2.0"
description = "GTK 4.16 + libadwaita 1.6 + Relm4 adapter for Yolo UI: 5-preset CSS stylesheets, GtkBuilder .ui XML builders, Material Symbols icons, and optional native system-gtk4 bindings"
repository = "https://github.com/yolo-rs/yolo-ui"

[features]
default = []
system-gtk4 = ["dep:gtk", "dep:adw"]

[dependencies]
yolo-shared = { path = "../../crates/yolo-shared" }
yolo-tokens = { path = "../../crates/yolo-tokens" }
yolo-emit = { path = "../../crates/yolo-emit" }
serde = { version = "1.0.228", features = ["derive"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_16"], optional = true }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"], optional = true }
