[package]
name = "yolo-gtk"
version = { workspace = true }
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
description = "GTK 4.16 + libadwaita 1.6 + Relm4 adapter for Yolo UI: 5-preset CSS stylesheets, GtkBuilder .ui XML builders, Material Symbols icons, and optional native system-gtk4 bindings"
repository = "https://github.com/yolo-rs/yolo-ui"

[features]
default = []
system-gtk4 = ["yolo-engines/system-gtk4"]

[dependencies]
yolo-engines = { workspace = true, features = ["gtk"] }
