[package]
name = "yolo-qt"
version = { workspace = true }
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
description = "Qt 6 / QML / cxx-qt adapter for Yolo UI: pure-Rust 21-role QPalette tables, YoloTheme.qml singleton generation, CxxQt bridge descriptors, and optional system-qt6 bindings"
repository = "https://github.com/yolo-rs/yolo-ui"

[features]
default = []
system-qt6 = ["yolo-engines/system-qt6"]

[dependencies]
yolo-engines = { workspace = true, features = ["qt"] }
