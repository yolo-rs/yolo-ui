[package]
name = "yolo-qt"
version = "0.8.0"
edition = "2024"
license = "Apache-2.0"
description = "Qt 6 / QML / cxx-qt adapter for Yolo UI: pure-Rust 21-role QPalette tables, YoloTheme.qml singleton generation, CxxQt bridge descriptors, and optional system-qt6 bindings"
repository = "https://github.com/yolo-rs/yolo-ui"

[features]
default = []
system-qt6 = ["dep:cxx", "dep:cxx-qt", "dep:cxx-qt-lib"]

[dependencies]
yolo-shared = { path = "../../crates/yolo-shared" }
yolo-tokens = { path = "../../crates/yolo-tokens" }
yolo-emit = { path = "../../crates/yolo-emit" }
serde = { version = "1.0.228", features = ["derive"] }
cxx = { version = "1.0", optional = true }
cxx-qt = { version = "0.8", optional = true }
cxx-qt-lib = { version = "0.8", features = ["qt_gui", "qt_qml"], optional = true }
