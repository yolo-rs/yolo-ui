[package]
name = "yolo-ui"
version = { workspace = true }
authors = ["Yolo UI Contributors <contact@aphrody.com>", "Dioxus Labs"]
edition.workspace = true
description = "Yolo UI unified fullstack Rust framework for Web (WASM/SSR), Desktop (Wry/Tauri v3), Native (Blitz/AnyRender/WGPU), GPUI, Iced/Cosmic, Egui/Craft, GTK4, Qt6, and React 19/Expo."
license = "MIT OR Apache-2.0"
repository = "https://github.com/yolo-rs/yolo-ui"
keywords = ["yolo-ui", "dioxus", "fullstack", "web", "desktop"]
rust-version.workspace = true

[dependencies]
yolo-shared = { workspace = true }
yolo-tokens = { workspace = true, optional = true }
yolo-contracts = { workspace = true, optional = true }
yolo-emit = { workspace = true, optional = true }
yolo-layout = { workspace = true, optional = true }
yolo-migrator = { workspace = true, optional = true }
yolo-shell = { workspace = true, optional = true }
yolo-craft = { workspace = true, optional = true }
yolo-storyteller = { workspace = true, optional = true }
yolo-react = { workspace = true, optional = true }
yolo-engines = { workspace = true, optional = true, default-features = false }
yolo-3d = { workspace = true, optional = true }
dioxus = { workspace = true, default-features = false }
dioxus-core = { workspace = true }
dioxus-signals = { workspace = true }
dioxus-stores = { workspace = true }
dioxus-hooks = { workspace = true }
dioxus-html = { workspace = true }
dioxus-document = { workspace = true }
dioxus-history = { workspace = true }
dioxus-router = { workspace = true, optional = true }
dioxus-fullstack = { workspace = true, optional = true }
dioxus-server = { workspace = true, optional = true }
dioxus-web = { workspace = true, optional = true }
dioxus-desktop = { workspace = true, optional = true }
dioxus-native = { workspace = true, optional = true }
dioxus-native-dom = { workspace = true, optional = true }
dioxus-liveview = { workspace = true, optional = true }
dioxus-ssr = { workspace = true, optional = true }
dioxus-logger = { workspace = true, optional = true }
dioxus-devtools = { workspace = true, optional = true }
dioxus-cli-config = { workspace = true, optional = true }
manganis = { workspace = true, optional = true }
subsecond = { workspace = true }
warnings = { workspace = true }

# Ecosystem crates in the unified workspace
dioxus-primitives = { workspace = true, optional = true }
dioxus-attributes = { workspace = true, optional = true }
dioxus-sdk = { workspace = true, optional = true }
dioxus-icons = { workspace = true, optional = true }
dioxus-code = { workspace = true, optional = true }
dioxus-html-macro = { workspace = true, optional = true }
rsrpc = { workspace = true, optional = true }

# Layout & Native Rendering Engine
blitz-dom = { workspace = true, optional = true }
blitz-html = { workspace = true, optional = true }
blitz-paint = { workspace = true, optional = true }
blitz-traits = { workspace = true, optional = true }
anyrender = { workspace = true, optional = true }
taffy = { workspace = true, optional = true }

[features]
default = [
    "lib",
    "router",
]
lib = [
    "dioxus/lib",
    "dioxus/launch",
    "dioxus/devtools",
    "dioxus/logger",
    "dep:dioxus-logger",
    "dep:dioxus-devtools",
    "dep:dioxus-cli-config",
    "dep:manganis",
]
router = ["dioxus/router", "dep:dioxus-router"]
fullstack = ["dioxus/fullstack", "dep:dioxus-fullstack", "ssr"]
server = ["dioxus/server", "dep:dioxus-server", "fullstack"]
web = ["dioxus/web", "dep:dioxus-web"]
desktop = ["dioxus/desktop", "dep:dioxus-desktop"]
mobile = ["dioxus/mobile", "dep:dioxus-desktop"]
native = [
    "dioxus/native",
    "dep:dioxus-native",
    "dep:dioxus-native-dom",
    "dep:blitz-dom",
    "dep:blitz-html",
    "dep:blitz-paint",
    "dep:blitz-traits",
    "dep:anyrender",
    "dep:taffy",
]
liveview = ["dioxus/liveview", "dep:dioxus-liveview"]
ssr = ["dioxus/ssr", "dep:dioxus-ssr"]

# Ecosystem batteries
primitives = ["dep:dioxus-primitives", "dep:dioxus-attributes"]
sdk = ["dep:dioxus-sdk"]
icons = ["dep:dioxus-icons"]
code = ["dep:dioxus-code"]
html-macro = ["dep:dioxus-html-macro"]
rpc = ["dep:rsrpc"]

# Multi-Engine Stack Bridges (GPUI, Iced, Cosmic, Egui, GTK4, Qt6, Tauri v3, Craft, Storyteller, React)
tokens = ["dep:yolo-tokens"]
contracts = ["dep:yolo-contracts"]
emit = ["dep:yolo-emit"]
layout = ["dep:yolo-layout"]
migrator = ["dep:yolo-migrator"]
shell-lifecycle = ["dep:yolo-shell"]
craft = ["dep:yolo-craft"]
storyteller = ["dep:yolo-storyteller"]
react = ["dep:yolo-react"]
gpui = ["dep:yolo-engines", "yolo-engines/gpui"]
iced = ["dep:yolo-engines", "yolo-engines/iced"]
tauri = ["dep:yolo-engines", "yolo-engines/tauri"]
tauri-desktop-shell = ["tauri", "yolo-engines/desktop-shell"]
egui = ["dep:yolo-engines", "yolo-engines/egui"]
cosmic = ["dep:yolo-engines", "yolo-engines/cosmic"]
gtk = ["dep:yolo-engines", "yolo-engines/gtk"]
qt = ["dep:yolo-engines", "yolo-engines/qt"]
three3d = ["dep:yolo-3d"]
multi-engine = [
    "tokens",
    "contracts",
    "emit",
    "layout",
    "migrator",
    "shell-lifecycle",
    "craft",
    "storyteller",
    "react",
    "gpui",
    "iced",
    "tauri",
    "egui",
    "cosmic",
    "gtk",
    "qt",
    "three3d",
]
all-engines = ["multi-engine", "native"]
