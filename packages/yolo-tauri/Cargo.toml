[package]
name = "yolo-tauri"
version = { workspace = true }
authors = [
  "Aphrody <contact@aphrody.com>",
  "Tauri Programme within The Commons Conservancy",
  "Dioxus Labs",
]
edition.workspace = true
description = "Tauri v3 Alpha integration using Wry, ACL capabilities, and an IPC bridge for Yolo UI and Dioxus Fullstack."
license = "MIT OR Apache-2.0"
repository = "https://github.com/aphrody-labs/yolo-ui"
keywords = ["tauri", "dioxus", "wry", "tao", "desktop"]
categories = ["gui", "web-programming"]
rust-version.workspace = true

[dependencies]
yolo-engines = { workspace = true, default-features = false, features = ["tauri"] }

[features]
default = ["ACL", "ipc"]
ACL = []
ipc = []
desktop-shell = [
  "yolo-engines/desktop-shell",
]
