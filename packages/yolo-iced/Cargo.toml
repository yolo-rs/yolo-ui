[package]
name = "yolo-iced"
version = { workspace = true }
authors = [
  "Aphrody <contact@aphrody.com>",
  "Héctor Ramón <hector@iced.rs>",
  "Iced Contributors",
]
edition.workspace = true
description = "Aphrody Labs Elm-architecture (MVU) Iced stack integration, Material 3 Dark-Glass theme converter, audio DSP widget descriptors (iced_audio), extended widgets (iced_aw), and Comet debugger telemetry for Yolo UI."
license = "MIT OR Apache-2.0"
repository = "https://github.com/aphrody-labs/yolo-ui"
keywords = ["iced", "gui", "elm", "mvu", "dioxus"]
rust-version.workspace = true

[dependencies]
yolo-engines = { workspace = true, features = ["iced"] }

[features]
default = ["aw", "audio", "comet", "cryoglyph"]
wgpu = []
tiny-skia = []
opengl = []
aw = ["yolo-engines/aw"]
audio = ["yolo-engines/audio"]
comet = ["yolo-engines/comet"]
cryoglyph = ["yolo-engines/cryoglyph"]
